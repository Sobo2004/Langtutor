name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (backend + browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install headless Chromium for the browser tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Build and smoke-test the Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t langtutor:${{ github.sha }} .

      - name: Start the container and check it responds
        run: |
          docker run -d --name langtutor -p 8000:8000 -e ADMIN_PASSWORD=ci-admin-password langtutor:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/version; then echo; echo "App is up"; exit 0; fi
            sleep 1
          done
          docker logs langtutor
          exit 1
